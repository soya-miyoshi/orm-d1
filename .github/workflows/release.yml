# Publishes `orm-d1` and `orm-d1-kit` to npm, in lockstep, from a GitHub Release.
#
# Authentication is npm **trusted publishing** (OIDC): no NPM_TOKEN, no
# long-lived secret to rotate. The `id-token: write` permission below is what
# lets the runner mint the OIDC token npm exchanges for a short-lived one, and
# provenance attestations are generated automatically — `--provenance` is not
# passed, and must not be, because npm adds it for OIDC publishes itself.
#
# One-time setup on npmjs.com, per package, before the first automated run:
#   Package → Settings → Trusted Publisher → GitHub Actions
#     repository: <owner>/orm-d1     workflow: release.yml
# npm's UI attaches a trusted publisher to a package that already exists, so the
# very first publish of each package is normally done by hand. See RELEASING.md.
name: Release

on:
  release:
    types: [published]
  # Lets you exercise the whole path — gate, version check, packing — without
  # publishing. Defaults to a dry run precisely so a mis-click cannot ship.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate, but do not publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for OIDC; without it npm falls back and fails

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x; trusted publishing needs npm >= 11.5.1. Without
      # this the publish fails with an auth error that does not mention OIDC.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The tag is the single source of truth for the release, and both packages
      # move together. A mismatch here is caught before anything is published,
      # because npm has no unpublish story worth relying on.
      - name: Check versions agree with the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          kit=$(node -p "require('./kit/package.json').version")
          peer=$(node -p "require('./kit/package.json').peerDependencies['orm-d1']")

          echo "tag=$tag root=$root kit=$kit kit.peer(orm-d1)=$peer"

          [ "$tag" = "$root" ] || { echo "::error::tag $tag != orm-d1 $root"; exit 1; }
          [ "$tag" = "$kit" ]  || { echo "::error::tag $tag != orm-d1-kit $kit"; exit 1; }

          # Lockstep means the peer range must admit the version being published.
          npx --yes semver -r "$peer" "$root" >/dev/null \
            || { echo "::error::orm-d1-kit peer range '$peer' does not admit $root"; exit 1; }

      # typecheck -> build -> test (unit + workerd) -> kit typecheck -> kit build.
      # This is the same gate `prepublishOnly` runs locally, and it produces both
      # `dist/` and `kit/dist/`, which is why the publishes below skip scripts.
      - name: Gate
        run: npm run check

      - name: Verify both builds are present
        run: |
          for d in dist kit/dist; do
            [ -d "$d" ] && [ -n "$(ls -A "$d")" ] || { echo "::error::$d is missing or empty"; exit 1; }
          done

      # Inspect exactly what would ship. `files` is restrictive in both
      # packages, so this is the cheapest guard against an empty or bloated
      # tarball reaching the registry.
      # Note: `--prefix kit` does NOT work here — npm still reads the root
      # package.json and packs orm-d1 twice. The working directory is what
      # selects the package.
      - name: Show tarball contents
        run: npm pack --dry-run

      - name: Show kit tarball contents
        working-directory: kit
        run: npm pack --dry-run

      # `--ignore-scripts`: the gate above already ran the full check and built
      # both packages. Without it, `prepublishOnly` runs the entire suite a
      # second time per package, and kit's would rebuild against a `dist/` it
      # does not own.
      - name: Publish orm-d1
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --ignore-scripts

      # Order matters: orm-d1-kit peer-depends on orm-d1, so the dependency is
      # on the registry before anything can resolve the dependent.
      - name: Publish orm-d1-kit
        if: github.event_name == 'release' || inputs.dry_run == false
        working-directory: kit
        run: npm publish --ignore-scripts

      - name: Dry run complete
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Validated without publishing. Re-run with dry_run=false to publish."
