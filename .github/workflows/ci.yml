# The gate `prepublishOnly` already runs locally, run on every push and PR.
#
# `npm run check` is typecheck -> build -> test -> kit typecheck, in that order,
# and the order matters: `test/unit/module-resolution.test.ts` bundles against
# `dist/`, so it needs the build to have happened.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10.x, which rejects this tree: `better-auth` declares
      # an *optional* peer `drizzle-orm@^0.45.2` and we install 1.0.0-rc.4 on
      # purpose. npm 11 treats an unmet optional peer as the warning it is; npm
      # 10 fails with ERESOLVE. The lockfile is generated by npm 11, so pin the
      # runner to the same major rather than papering over it with
      # --legacy-peer-deps (which would disable peer checking wholesale).
      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      # `npm ci` needs the lockfile to be in step with package.json; a drift
      # here is itself worth failing on.
      - run: npm ci

      - run: npm run check
